services:
  - type: web
    name: forensier-backend
    runtime: python
    region: oregon            # free tier region
    plan: free
    buildCommand: pip install -r requirements.txt && python database/seed_db.py
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SECRET_KEY
        generateValue: true   # Render auto-generates a random secret
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false           # fill in the Render dashboard — don't commit passwords
      - key: INSPECTOR_USERNAME
        value: inspector
      - key: INSPECTOR_PASSWORD
        sync: false           # fill in the Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false           # fill in after Vercel deploy: https://<your-app>.vercel.app
