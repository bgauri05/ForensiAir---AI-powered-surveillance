services:
  - type: web
    name: forensier-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: bash start.sh
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false           # fill in Render dashboard
      - key: INSPECTOR_USERNAME
        value: inspector
      - key: INSPECTOR_PASSWORD
        sync: false           # fill in Render dashboard
      - key: ALLOWED_ORIGINS
        sync: false           # set to your Vercel URL after frontend deploy
